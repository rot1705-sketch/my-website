{% extends "base.html" %}
{% block content %}
<h1>איזה תואר את/ה לומד/ת?</h1>
<p class="muted">בחר/י תואר, אחר כך מקצוע, ונבנה לך מבחן תרגול רנדומלי עם פתרונות.</p>
<div class="cards">
  {% for d in degrees %}
  <a class="card" href="{{ url_for('degree', degree_id=d.id) }}">
    <strong>{{ d.name }}</strong>
    <span class="muted">{{ d.courses|length }} מקצועות</span>
  </a>
  {% endfor %}
</div>
{% endblock %}
