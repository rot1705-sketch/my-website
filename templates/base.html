<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tofes0{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="logo" href="{{ url_for('home') }}">Tofes0</a>
    <span class="tag">מבחנים רנדומליים מטפסי 0</span>
    <nav class="user">
      {% if user %}
      <a href="{{ url_for('profile') }}">שלום, {{ user.name }}</a>
      <form method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <button class="link">התנתקות</button>
      </form>
      {% else %}
      <a class="btn small" href="{{ url_for('login') }}">התחברות</a>
      {% endif %}
    </nav>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
